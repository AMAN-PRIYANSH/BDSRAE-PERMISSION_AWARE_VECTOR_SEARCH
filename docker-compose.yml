# Permission-Aware Vector Search - full local stack
#
# Milvus services (milvus-volume-init, etcd, minio, standalone) are taken from
# the official Milvus v3.0.3 standalone compose file:
#   https://github.com/milvus-io/milvus/releases/download/v3.0.3/milvus-standalone-docker-compose.yaml
# Changes from the official file:
#   - named Docker volumes instead of bind mounts (bind mounts from the Windows
#     filesystem are slow for etcd and break the chown in milvus-volume-init)
#   - memory limits on every service, so the whole stack fits in Docker's RAM
#   - MinIO is shared: Milvus uses its own bucket, Iceberg uses "lakehouse"

x-milvus-image: &milvus-image milvusdb/milvus:v3.0.3

services:
  milvus-volume-init:
    image: *milvus-image
    user: "0:0"
    network_mode: none
    read_only: true
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        uid="$$(id -u milvus)"
        gid="$$(id -g milvus)"
        marker="/var/lib/milvus/.milvus-volume-owner-$${uid}-$${gid}"
        if [ ! -e "$${marker}" ]; then
          echo "Preparing /var/lib/milvus for $${uid}:$${gid}"
          chown -R "$${uid}:$${gid}" /var/lib/milvus
          touch "$${marker}"
          chown "$${uid}:$${gid}" "$${marker}"
        fi
    volumes:
      - milvus_data:/var/lib/milvus

  etcd:
    container_name: pavs-etcd
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd_data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3
    mem_limit: 512m

  minio:
    container_name: pavs-minio
    image: milvusdb/minio:RELEASE.2024-12-18T13-15-44Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"   # MinIO web console: http://localhost:9001
      - "9000:9000"
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
    mem_limit: 1g

  standalone:
    container_name: pavs-milvus
    image: *milvus-image
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      MINIO_REGION: us-east-1
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus_data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      milvus-volume-init:
        condition: service_completed_successfully
      etcd:
        condition: service_started
      minio:
        condition: service_started
    mem_limit: 6g

  kafka:
    container_name: pavs-kafka
    image: apache/kafka:4.3.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 15s
      retries: 10
      start_period: 20s
    mem_limit: 1g

  postgres:
    container_name: pavs-postgres
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: iceberg
      POSTGRES_PASSWORD: iceberg
      POSTGRES_DB: iceberg
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iceberg -d iceberg"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m

  app:
    container_name: pavs-app
    build: .
    image: pavs-app:dev
    command: ["sleep", "infinity"]
    environment:
      PAVS_MILVUS_URI: http://standalone:19530
      PAVS_KAFKA: kafka:9092
      PAVS_S3_ENDPOINT: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
      AWS_REGION: us-east-1
    volumes:
      - ./src:/app/src
      - ./tests:/app/tests
      - ./notebooks:/app/notebooks
      - ./logs:/app/logs
      - ./data:/app/data
      - ./results:/app/results
      - hf_models:/models
    depends_on:
      standalone:
        condition: service_started
      kafka:
        condition: service_started
      postgres:
        condition: service_started
    mem_limit: 5g

  # Demo services: start with  docker compose --profile demo up -d
  api:
    container_name: pavs-api
    image: pavs-app:dev
    profiles: ["demo"]
    command: ["uvicorn", "src.pavs.api:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      PAVS_MILVUS_URI: http://standalone:19530
      HF_HOME: /models
    volumes:
      - ./src:/app/src
      - ./logs:/app/logs
      - hf_models:/models
    ports:
      - "8000:8000"   # http://localhost:8000/docs
    depends_on:
      standalone:
        condition: service_started
    mem_limit: 2g

  ui:
    container_name: pavs-ui
    image: pavs-app:dev
    profiles: ["demo"]
    command: ["streamlit", "run", "src/pavs/ui.py", "--server.port", "8501", "--server.address", "0.0.0.0",
              "--server.headless", "true", "--browser.gatherUsageStats", "false"]
    environment:
      PAVS_MILVUS_URI: http://standalone:19530
      HF_HOME: /models
      PYTHONPATH: /app
    volumes:
      - ./src:/app/src
      - ./logs:/app/logs
      - hf_models:/models
    ports:
      - "8501:8501"   # http://localhost:8501
    depends_on:
      standalone:
        condition: service_started
    mem_limit: 2g

  # Orchestration: start with  docker compose --profile orchestration up -d   (UI: http://localhost:8080)
  # Airflow runs the batch jobs IN the app container through the Docker socket; it adds no second
  # copy of Spark. Its own metadata lives in a separate "airflow" database in the same Postgres.
  airflow:
    container_name: pavs-airflow
    image: apache/airflow:3.3.2-python3.12
    profiles: ["orchestration"]
    user: "50000:0"
    command: ["bash", "/opt/pavs-orchestration/airflow_start.sh"]
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://iceberg:iceberg@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__PARALLELISM: "4"
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "False"
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_USERS: admin:admin
      AIRFLOW__DAG_PROCESSOR__REFRESH_INTERVAL: "30"
      AIRFLOW__API__WORKERS: "1"
      AIRFLOW__API_AUTH__JWT_SECRET: pavs-local-dev-only-change-me
      AIRFLOW__API__SECRET_KEY: pavs-local-dev-only-change-me
      PAVS_APP_CONTAINER: pavs-app
    volumes:
      - ./orchestration/dags:/opt/airflow/dags
      - ./orchestration:/opt/pavs-orchestration:ro
      - ./logs/airflow:/opt/airflow/logs
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "8080:8080"   # http://localhost:8080  (admin / admin)
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/api/v2/monitor/health >/dev/null"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
      app:
        condition: service_started
    mem_limit: 2560m

volumes:
  etcd_data:
  minio_data:
  milvus_data:
  pg_data:
  hf_models:

networks:
  default:
    name: pavs
