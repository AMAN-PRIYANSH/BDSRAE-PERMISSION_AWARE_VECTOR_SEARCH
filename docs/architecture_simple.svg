<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 760 444' font-family='DejaVu Sans, Arial, sans-serif' font-size='13' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect x='0' y='0' width='760' height='444' fill='white'/><defs><marker id='a' viewBox='0 0 10 10' refX='9' refY='5' markerWidth='6' markerHeight='6' orient='auto-start-reverse'><path d='M0 0L10 5L0 10z' fill='#8a8f98'/></marker></defs><text x='22' y='28' font-size='15' font-weight='600' fill='#1a1a1a'>Papers flow into Milvus; permission changes reach it by a fast path</text><text x='22' y='48' font-size='11.5' fill='#555b63'>The permission filter runs inside Milvus (highlighted), before any result exists</text><g fill='none' stroke='#8a8f98' stroke-width='1.25'><path d='M178 110H202' marker-end='url(#a)'/><path d='M358 110H382' marker-end='url(#a)'/><path d='M178 244H202' marker-end='url(#a)'/><path d='M460 146V208' marker-end='url(#a)'/><path d='M460 280V342' marker-end='url(#a)'/><path d='M538 378H562' marker-end='url(#a)'/><path d='M640 342V280' marker-end='url(#a)'/><path d='M344 208L394 148' marker-end='url(#a)'/><path d='M280 280V378H382' marker-end='url(#a)'/></g><rect x='22.0' y='74.0' width='156' height='72' rx='8' fill='none' stroke='#8a8f98' stroke-width='1.25'/><text x='100' y='98' text-anchor='middle' font-weight='600' fill='#1a1a1a'>Kaggle T4 GPU</text><text x='100' y='118' text-anchor='middle' font-size='11.5' fill='#555b63'>1M papers + 2k</text><text x='100' y='134' text-anchor='middle' font-size='11.5' fill='#555b63'>queries embedded</text><rect x='202.0' y='74.0' width='156' height='72' rx='8' fill='none' stroke='#8a8f98' stroke-width='1.25'/><text x='280' y='98' text-anchor='middle' font-weight='600' fill='#1a1a1a'>Spark: ingest</text><text x='280' y='118' text-anchor='middle' font-size='11.5' fill='#555b63'>gives every paper</text><text x='280' y='134' text-anchor='middle' font-size='11.5' fill='#555b63'>its access label</text><rect x='382.0' y='74.0' width='156' height='72' rx='8' fill='none' stroke='#8a8f98' stroke-width='1.25'/><text x='460' y='98' text-anchor='middle' font-weight='600' fill='#1a1a1a'>Iceberg tables</text><text x='460' y='118' text-anchor='middle' font-size='11.5' fill='#555b63'>on MinIO storage,</text><text x='460' y='134' text-anchor='middle' font-size='11.5' fill='#555b63'>catalog in Postgres</text><rect x='22.0' y='208.0' width='156' height='72' rx='8' fill='none' stroke='#8a8f98' stroke-width='1.25'/><text x='100' y='232' text-anchor='middle' font-weight='600' fill='#1a1a1a'>Kafka topic</text><text x='100' y='252' text-anchor='middle' font-size='11.5' fill='#555b63'>permission-change</text><text x='100' y='268' text-anchor='middle' font-size='11.5' fill='#555b63'>events</text><rect x='202.0' y='208.0' width='156' height='72' rx='8' fill='none' stroke='#8a8f98' stroke-width='1.25'/><text x='280' y='232' text-anchor='middle' font-weight='600' fill='#1a1a1a'>Spark Streaming</text><text x='280' y='252' text-anchor='middle' font-size='11.5' fill='#555b63'>applies changes:</text><text x='280' y='268' text-anchor='middle' font-size='11.5' fill='#555b63'>fast + slow path</text><rect x='382.0' y='208.0' width='156' height='72' rx='8' fill='none' stroke='#8a8f98' stroke-width='1.25'/><text x='460' y='232' text-anchor='middle' font-weight='600' fill='#1a1a1a'>Spark: index</text><text x='460' y='252' text-anchor='middle' font-size='11.5' fill='#555b63'>copies papers and</text><text x='460' y='268' text-anchor='middle' font-size='11.5' fill='#555b63'>vectors to Milvus</text><rect x='382.0' y='342.0' width='156' height='72' rx='8' fill='#2563eb' fill-opacity='0.12' stroke='#2563eb' stroke-width='2'/><text x='460' y='366' text-anchor='middle' font-weight='600' fill='#1a1a1a'>Milvus</text><text x='460' y='386' text-anchor='middle' font-size='11.5' fill='#555b63'>HNSW + label filter,</text><text x='460' y='402' text-anchor='middle' font-size='11.5' fill='#555b63'>partition per label</text><rect x='562.0' y='342.0' width='156' height='72' rx='8' fill='none' stroke='#8a8f98' stroke-width='1.25'/><text x='640' y='366' text-anchor='middle' font-weight='600' fill='#1a1a1a'>Search core</text><text x='640' y='386' text-anchor='middle' font-size='11.5' fill='#555b63'>role to labels,</text><text x='640' y='402' text-anchor='middle' font-size='11.5' fill='#555b63'>fail-closed, recheck</text><rect x='562.0' y='208.0' width='156' height='72' rx='8' fill='none' stroke='#8a8f98' stroke-width='1.25'/><text x='640' y='232' text-anchor='middle' font-weight='600' fill='#1a1a1a'>API, UI, tests</text><text x='640' y='252' text-anchor='middle' font-size='11.5' fill='#555b63'>FastAPI, Streamlit,</text><text x='640' y='268' text-anchor='middle' font-size='11.5' fill='#555b63'>leak tests, benchmark</text><text x='340' y='186' text-anchor='end' font-size='11.5' fill='#555b63'>slow path, every 1 s</text><text x='290' y='326' font-size='11.5' fill='#555b63'>fast path, every 0.2 s</text></svg>